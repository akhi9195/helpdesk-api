# Shared settings for every profile
spring:
  application:
    name: helpdesk-api
  profiles:
    default: local          # fallback only; SPRING_PROFILES_ACTIVE overrides it
  threads:
    virtual:
      enabled: true         # Tomcat handles requests on virtual threads
  jpa:
    open-in-view: false     # no lazy loading outside @Transactional services
    hibernate:
      ddl-auto: validate    # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true       # /actuator/health/liveness and /readiness
      show-details: never

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    persist-authorization: true     # token survives page refresh
    try-it-out-enabled: true        # no extra click per endpoint
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION_MINUTES:60}m
    issuer: helpdesk-api
  admin:
    email: ${ADMIN_EMAIL:}          # no default here: prod must set it explicitly
    password: ${ADMIN_PASSWORD:}
    full-name: Help Desk Admin
  demo:
    enabled: ${DEMO_ENABLED:true}
    support:
      email: ${DEMO_SUPPORT_EMAIL:}
      password: ${DEMO_SUPPORT_PASSWORD:}
      full-name: Demo Support
    user:
      email: ${DEMO_USER_EMAIL:}
      password: ${DEMO_USER_PASSWORD:}
      full-name: Demo User

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-} user=%X{userId:-}]"
  level:
    helpdesk.access: INFO