# Daily development
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DB_USERNAME:helpdesk_app}
    password: ${DB_PASSWORD}

logging:
  level:
    com.portfolio.helpdesk: DEBUG

management:
  endpoint:
    health:
      show-details: always
app:
  admin:
    email: ${ADMIN_EMAIL:admin@helpdesk.demo}
    password: ${ADMIN_PASSWORD:Admin@2026}
  demo:
    enabled: ${DEMO_ENABLED:true}
    support:
      email: ${DEMO_SUPPORT_EMAIL:support@helpdesk.demo}
      password: ${DEMO_SUPPORT_PASSWORD:Support@2026}
    user:
      email: ${DEMO_USER_EMAIL:user@helpdesk.demo}
      password: ${DEMO_USER_PASSWORD:User@2026}