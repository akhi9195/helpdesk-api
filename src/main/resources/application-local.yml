# Daily development
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DB_USERNAME:helpdesk_app}
    password: ${DB_PASSWORD}

logging:
  level:
    com.portfolio.helpdesk: DEBUG

management:
  endpoint:
    health:
      show-details: always
